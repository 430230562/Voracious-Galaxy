 dolores_paragon_name: "Dolores Apex Caretaker Perfected"
 dolores_paragon_desc: "§H The Machine is incredibly tall compared to most mammalian species in the galaxy. A mass of nanites of an unknown design or origin shift around her and the scans say she doesn't have any conventional power source for a machine Unit"
 dolores_paragon_desc_intro: "Hello my Darling... prey"
 voragons.150.option_1: "Who are you?"
 voragons.150.option_1_response: "I am Dolores, your new Cartaker"
  voragons.150.option_2: "What happened to the research team?"
 voragons.150.option_2_response: "I don't know... *hic*."
 voragons.150.option_3: "What.is the structure above the planet?"
 voragons.150.option_3_response: "that is a Top of the line §R|ERROR #//x364 $$#-?? " -- DATA CORRUPTED|§!of course! I should devour you for even asking that... "
 voragons.150.option_4: "You have a unique design."
 voragons.150.option_4_response: "Quite certainly, but... that comes at a price. If you want to have my protection, I need some well... prey to continue running and functioning at full power and capabilities ."
 voragons.150.hire: "§YDolores§! joins our empire as a §HLeader§!."
 dolores_paragon_catch_phrase: "§L"mmph this one is strugling alot. I wonder if it will become my ass or tit fat"§!"
 Voragon_dolores.155.desc: "There was a situation involving that robot we dug up off Guarding Complex.When attempting to deliver a message to our ruler one of the servants stumbled on a scene, that while not unexpected could prove to be an issue. When they entered into our leader's office they were greeted by the legs of our ruler slowly descending down the throat of the robo-girl. Taking her time Doloras seemed to be enjoying her meal, if the pleased moans, are anything to go off of. With a final loud GULP she finished off the former leader and smiled at the servant. Sorry I was hungry and they were right there....Doloras says with a grin before patting her distended gut.But now the question is what do we do with her?"
 Voragon_dolores.155.a: "As she said, She was hungry.."
 Voragon_dolores.155.a.tooltip: "Let's her off, no further action taken"
 Voragon_dolores.155.b: "Dismantle this Gluttonous Robot"
 Voragon_dolores.155.b.tooltip: "she Devoured the ruler so Go destroy her then at all costs pls :) +alloys"
 Voragon_dolores.155.c: "She Is an Example to us!"
 Voragon_dolores.155.c.tooltip: "Makes her the new ruler,"
 voragons.156.name: "Our soldiers managed to kill dolores"
 voragons.156.desc: "Our soldiers managed to drag Doloras out in front of the capitol. Our people watched as the gluttonous robot attempted to defend herself only to be met with a firing squad.After unloading their magazines into her the now destroyed robot was handed off to the scientists to glean what they can from her memory banks while the rest of the body was melted down for scrap :("
 voragons.157.name: "The people of our empire gather."
 voragons.157.desc: "The Capitol is shown as Doloras steps out in front of the microphones to address our people. Citizens of this nation I must say, being proclaimed your leader was something I did not expect but something I accept nonetheless She says as our people listen intently to every word the robot girl says.But I promise you that together we will prove that we are the greatest predators in the galaxy! And I will not repeat the mistakes those that created me did"
 voragons.159.name: "devouring the tratior"
 voragons.159.desc: "In the struggle one of our Military Council Members Managed to get a hold of Dolores and began stuffing the robot gal down their throat. Just as quickly as the Robot gal devoured our ruler, so did our minister devour her URAP~ That's what you get you dumb machine... now get ready to make me fat"
 Voragon_dolores.158.d: "devour the tratior"
 Voragon_dolores.158.d.tooltip: "Ill show you a Apex predator >:("