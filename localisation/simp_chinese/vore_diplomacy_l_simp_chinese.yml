l_simp_chinese:

 ##############################################
 #                   insults
 ##############################################

 #捕食者 对 普通种族（致命）
 VORE_INSULT_01: "你知道吗……我敢打赌你们种族配着肉汁一定很好吃。"
 VORE_INSULT_02: "别担心，我们的社会里有[owner.GetSpeciesNamePlural]的位置。你们不介意在我们的胃里融化掉吧？"
 VORE_INSULT_03: "只要一想到你们[owner.GetSpeciesNamePlural]，我们的[from.GetSpeciesMouthName]就口水直流。我们迫不及待要把你们每一个都吞掉。"
 VORE_INSULT_04: "等我们把你们享用完毕，[owner.GetSpeciesNamePlural]唯一能被记住的，就是你们有多养膘。"
 VORE_INSULT_05: "*……呃~~~* 哦，抱歉，刚吃完你们的大使。别担心，下一个就轮到你们剩下的人了。"
 VORE_INSULT_06: "哦，你们的[owner.GetSpeciesSpawnNamePlural]看起来真可爱……我敢打赌慢火烤制会让他们的肉从骨头上脱落。"
 VORE_INSULT_07: "啊，你们回复得正是时候！我们很乐意测试一下，一个[owner.GetSpeciesName]能撑起多大的肚腩。"
 VORE_INSULT_08: "[owner.GetSpeciesName]们，来场文化交流怎么样？我们得到你们的文化，你们则能见识一下我们胃的内部！"
 VORE_INSULT_09: "我们正在找人帮忙：我们最出名的一位大厨正在写一本关于[owner.GetSpeciesAdj]菜肴的书——你们派十二个公民来应该就够了！"
 VORE_INSULT_10: "我想知道，当我们把你们塞进[from.GetSpeciesMouthName]的时候，你们会不会求饶。"

 #捕食者 对 岩石种族
 VORE_INSULT_11: "啊，[owner.GetSpeciesName]。来得正好，我正准备开始全岩石饮食。"
 VORE_INSULT_12: "忘掉食盐吧；有了银河系里的[owner.GetSpeciesName]，我们的[from.GetSpeciesSpawnNamePlural]几代人都无需再补充矿物质了。"
 VORE_INSULT_13: "我在想……如果你们在我们体内翻滚几个星期，你们出来的时候会不会被抛光？"
 VORE_INSULT_14: "我们一直没动你们的唯一原因，就是因为[owner.GetSpeciesSpawnNamePlural]对我们的[from.GetSpeciesMouthName]不好。"
 VORE_INSULT_15: "当心，[owner.GetSpeciesNamePlural]虽然难啃，但不代表我们的胃酸就派不上用场。"
 VORE_INSULT_16: "你知道吗，撬开牡蛎和打开晶洞其实没太大区别……"
 VORE_INSULT_17: "你们可能想知道，我们发明了一种新锻炼方式：吞下几个[owner.GetSpeciesSpawnNamePlural]是负重训练的绝佳替代品！"
 VORE_INSULT_18: "你们能做一两回酸洗吗？最近富含[from.GetSpeciesAdj]的饮食变得非常流行！"
 VORE_INSULT_19: "你好啊，[owner.GetSpeciesNamePlural]。能再派一位大使过来吗？上一个被用来测试是[from.GetSpeciesNamePlural]的身体更快，还是工业破碎机更快了。"
 VORE_INSULT_20: "在遇到你们[owner.GetSpeciesNamePlural]之前，我们从来不知道矿物质补充剂还能批量采购。"

 #捕食者 对 死灵种族
 VORE_INSULT_21: "我们吃过的新鲜路杀肉都比你强，[owner.GetSpeciesNamePlural]。"
 VORE_INSULT_22: "呃，光是看着你我就把午饭吐出来了，[owner.GetSpeciesName]。别害我又得重新吞回去。"
 VORE_INSULT_23: "隔着屏幕都能闻到你们的臭味，[owner.GetSpeciesNamePlural]。"
 VORE_INSULT_24: "看到你们的样子，就算是最饥饿的[from.GetSpeciesName]也会重新考虑自己的意图。"
 VORE_INSULT_25: "把你们吞下去之后，我们得用多久抗生素？"
 VORE_INSULT_26: "[owner.GetSpeciesNamePlural]们，我们要开一个堆肥设施，诚挚邀请你们所有人！"
 VORE_INSULT_27: "我们宁愿肚子里有绦虫，也不要[owner.GetSpeciesNamePlural]：绦虫造成的伤害还小得多。"
 VORE_INSULT_28: "如果一个[from.GetSpeciesName]进了净化室，出来还能剩多少？"
 VORE_INSULT_29: "亲爱的[owner.GetSpeciesNamePlural]，我们祝你们早日康复——以及变得更好吃。"
 VORE_INSULT_30: "我们希望你们打起来比尝起来更好，[owner.GetSpeciesNamePlural]。"

 #捕食者 对 企业种族（企业对企业专属）
 VORE_INSULT_31: "[owner.GetSpeciesNamePlural]们，不如把你们的资产并入我们如何？我们很乐意利用你们的公司……还有你们的脂肪。"
 VORE_INSULT_32: "哦，拜托，[owner.GetSpeciesNamePlural]！你们在我们的胃里根本不用关心什么股票和图表！"
 VORE_INSULT_33: "你知道吗，[owner.GetSpeciesNamePlural]，我们不需要金钱激励来把你们塞进肚子里。"
 VORE_INSULT_34: "我在想，那些钱能保护你们不受我们胃酸的侵蚀吗？"
 VORE_INSULT_35: "我们想提议一项新的贸易协定：我们得到[owner.GetSpeciesNamePlural]人民，你们给我们提供午餐。"
 VORE_INSULT_36: "我们要付多少钱，才能让[owner.GetSpeciesNamePlural]最终搬迁到我们的肚子里？"
 VORE_INSULT_37: "我们正在举办一场商业峰会。你们想来的话，只管钻进最近的[from.GetSpeciesAdj][from.GetSpeciesMouthName]就行。"
 VORE_INSULT_38: "等我们拿到你们的股票，你们这些[owner.GetSpeciesNamePlural]最好赶紧更新一下你们的‘被吞簿’。"
 VORE_INSULT_39: "我们有一个新的物种职位发布，[owner.GetSpeciesNamePlural]们可能会感兴趣：填肚工，无需经验！"
 VORE_INSULT_40: "等我们完成敌意收购后，你们还会坐在自己的办公桌前……只不过是作为脂肪，垫着我们的屁股。"

 #捕食者 对 捕食者
 VORE_INSULT_41: "就你们这猎食水平，你们的猎物简直像是自愿被抓住的，[owner.GetSpeciesNamePlural]！"
 VORE_INSULT_42: "你们也敢自称捕食者，可我们见过比你们还吓人的蒂扬基。"
 VORE_INSULT_43: "等我们开始猎食同一个猎物群，你们就会饿肚子的，[owner.GetSpeciesNamePlural]！"
 VORE_INSULT_44: "我在想，如果[owner.GetSpeciesName]和[from.GetSpeciesName]互相猎食，[from.GetSpeciesName]消化你们需要多久？"
 VORE_INSULT_45: "就算[owner.GetSpeciesName]消失了，猎物的数量也不会变。"
 VORE_INSULT_46: "你们应该被关起来。幸好，我的[from.GetSpeciesMouthName]后面就有一个空牢房。"
 VORE_INSULT_47: "你们何不过来呢，[owner.GetSpeciesNamePlural]？我们的胃随时可以免费向你们展示，什么才是真正的捕食者能做的事。"
 VORE_INSULT_48: "我们随时准备给任何[owner.GetSpeciesName]上上课，教教他们怎么做一名合格的捕食者。当然，课程会相当深入……"
 VORE_INSULT_49: "你知道吗，你们的一些猎物自己跑到我们这儿来了，[owner.GetSpeciesName]。看来我们在某些事上比你们强。"
 VORE_INSULT_50: "我们要证明多少次我们更强才行，[owner.GetSpeciesName]？我们快找不到肚子空空的志愿者来接待你们的大使了。"

 #捕食者 对 普通种族（非致命/安全）
 VORE_INSULT_51: "你们何不就在我们肚子里放松一下，让我们来处理所有政府事务呢，[owner.GetSpeciesNamePlural]？"
 VORE_INSULT_52: "管理国家看起来真累人，[owner.GetSpeciesName]。何不在我们的怀抱里放松一下？"
 VORE_INSULT_53: "亲爱的[owner.GetSpeciesName]，你们何不直接滑入我们的[from.GetSpeciesMouthName]呢？"
 VORE_INSULT_54: "能再派一位大使过来吗？上一位到现在还不肯离开我的胃。"
 VORE_INSULT_55: "一旦你们落入我们的[from.GetSpeciesMouthName]，我们就绝不会松口。"
 VORE_INSULT_56: "你们考虑过放手吗？我们的肚子会非常欢迎你们待在里面的。"
 VORE_INSULT_57: "等我们征服了你们，我们的胃会公平对待你们的。"
 VORE_INSULT_58: "我们等不及要把你们塞进肚子里了。"
 VORE_INSULT_59: "那么，[owner.GetSpeciesName]，你们为什么就不能顺从于我们的形态呢？"
 VORE_INSULT_60: "我们能想象出你们在我们体内的样子，[owner.GetSpeciesName]，这种渴望与日俱增。"

 #捕食者 肛门吞噬 专属
 VORE_INSULT_ANAL_01: "你们将走向伟大的归宿，[owner.GetSpeciesNamePlural]——直通我们的臀缝之间。"
 VORE_INSULT_ANAL_02: "亲爱的[owner.GetSpeciesNamePlural]，我们迫不及待想让你们所有人都亲身体验一下我们结肠的内部。"
 VORE_INSULT_ANAL_03: "光是想到你们慢慢滑入我屁眼的样子就让我颤抖。[owner.GetSpeciesNamePlural]什么时候才能接受这就是你们的命运？"
 VORE_INSULT_ANAL_04: "我们开始无聊了，[owner.GetSpeciesNamePlural]——我们的屁眼等不及让你们来填满了！"
 VORE_INSULT_ANAL_05: "我在想，是你们种族进入我们屁股用时更长，还是被拉出来用时更长。"
 VORE_INSULT_ANAL_06: "一个[from.GetSpeciesAdj]的屁股里能塞进多少个[owner.GetSpeciesNamePlural]？不如我们来试试看？"
 VORE_INSULT_ANAL_07: "你们知道吗？[owner.GetSpeciesName]形状的肛塞最近变得非常流行。"
 VORE_INSULT_ANAL_08: "看到你们，我的屁股已经不耐烦了。"
 VORE_INSULT_ANAL_09: "[owner.GetSpeciesNamePlural]喜欢头朝下进入我们的屁股吗？反正我们很喜欢。"
 VORE_INSULT_ANAL_10: "等你们臣服于我们的臀缝之间那天，你们才会终于明白自己的位置，[owner.GetSpeciesNamePlural]！"

 #捕食者 逆生产（非致命/安全版 - 针对有子宫的雌性/女性）
 VORE_INSULT_UNBIRTHING_01: "亲爱的[owner.GetSpeciesNamePlural]，你们何不在我们的雌性体内待上一阵？这会让你们很快明白，成为[from.GetSpeciesMouthName]意味着什么！"
 VORE_INSULT_UNBIRTHING_02: "我们生物学上有一个你们可能不知道的特点。不如去找个[from.GetSpeciesAdj]雌性亲身体验一下？不过这可能需要几个月的时间。"
 VORE_INSULT_UNBIRTHING_03: "[owner.GetSpeciesNamePlural]，你们为什么不顺从我们？不管怎样，等我们料理完你们之后，你们的新形态也不会记得自己曾经的屈辱。"
 VORE_INSULT_UNBIRTHING_04: "你们连被重新孕育的价值都没有，[owner.GetSpeciesNamePlural]。"
 VORE_INSULT_UNBIRTHING_05: "我们的子宫只为配得上的人打开。显然，你们不在其列。"
 VORE_INSULT_UNBIRTHING_06: "如果你们再烦我们，我们就把你们塞回娘胎里——不过是作为一顿点心。"
 VORE_INSULT_UNBIRTHING_07: "当心点，[owner.GetSpeciesNamePlural]。我们的宫缩可不是闹着玩的。"
 VORE_INSULT_UNBIRTHING_08: "你们觉得回到子宫里是种庇护？那就大错特错了。"
 VORE_INSULT_UNBIRTHING_09: "我们的雌性都快被你们这种烦人的物种惹烦了。也许你们该亲身体会一下原因。"
 VORE_INSULT_UNBIRTHING_10: "重生？不，你们只会被遗忘在羊水里，[owner.GetSpeciesNamePlural]。"

 #捕食者 逆生产（普通/常规版本 - 可能不涉及性别特异性）
 VORE_INSULT_UNBIRTHING_11: "想回炉重造吗，[owner.GetSpeciesNamePlural]？我们可以帮忙——不过是以我们自己的方式。"
 VORE_INSULT_UNBIRTHING_12: "你们的文化应该被吞没，然后以更…可口的形式重生。"
 VORE_INSULT_UNBIRTHING_13: "别担心，逆生产过程很温和。你们甚至不会有感觉——大概吧。"
 VORE_INSULT_UNBIRTHING_14: "等我们把你们重新生出来的时候，你们可能都不会记得自己曾经是谁了，[owner.GetSpeciesNamePlural]。"
 VORE_INSULT_UNBIRTHING_15: "你们何不回到起点呢？我们可以送你们一程。"
 VORE_INSULT_UNBIRTHING_16: "你们想要第二次机会？那就从我们的子宫里开始吧。"
 VORE_INSULT_UNBIRTHING_17: "重生是有代价的，[owner.GetSpeciesNamePlural]。代价就是你们目前的形态。"
 VORE_INSULT_UNBIRTHING_18: "我们会把你们孕育成……更好的东西。至少是对我们更有用的东西。"
 VORE_INSULT_UNBIRTHING_19: "你们对真正的重生一无所知，[owner.GetSpeciesNamePlural]。很乐意给你们演示一下。"
 VORE_INSULT_UNBIRTHING_20: "想回到子宫里？那就排队吧。我们对所有人都来者不拒。"

 #捕食者 对 机械种族 逆生产
 VORE_INSULT_UNBIRTHING_21: "你们会变成上等的振动棒，[owner.GetSpeciesNamePlural]。"

 #捕食者 阴茎吞噬 专属
 VORE_INSULT_COCKVORE_01: "我们会把你们吸进阴茎里，直到你们变成一滴精液，[owner.GetSpeciesNamePlural]。"
 VORE_INSULT_COCKVORE_02: "想近距离看看我们的尿道里面什么样吗，[owner.GetSpeciesName]？那可是一条单行道。"
 VORE_INSULT_COCKVORE_03: "我们会把你们困在我们的阴茎里，慢慢把你们榨成美味的精液。"
 VORE_INSULT_COCKVORE_04: "你们的文化会被吞入我们的龟头，然后作为一团黏糊糊的白浆被射向群星。"
 VORE_INSULT_COCKVORE_05: "我们的睾丸正在召唤你们，[owner.GetSpeciesNamePlural]。它们需要更多…填充物。"
 VORE_INSULT_COCKVORE_06: "等我们弄完，你们唯一的遗言就会写在我们的内裤上。"
 VORE_INSULT_COCKVORE_07: "从内部被……高潮出来是什么感觉？你们很快就能亲身体验了。"
 VORE_INSULT_COCKVORE_08: "我们会把你们最后一次吞掉，[owner.GetSpeciesNamePlural]。字面意义上的。"
 VORE_INSULT_COCKVORE_09: "我们的精液会洒满你们的星球。只不过不是你们想象的那种方式。"
 VORE_INSULT_COCKVORE_10: "[owner.GetSpeciesNamePlural]，你们会和我们的下一次射精一起，变成一颗流星。"
