l_simp_chinese:

 ######################
 #       问候语
 ######################

 VORE_HOSTILE_GREETING_01: "我们是自愿来的，可不像我们的猎物。"
 VORE_HOSTILE_GREETING_02: "别担心，消化过程不疼……或者，至少没人抱怨过。"
 VORE_HOSTILE_GREETING_03: "你有没有好奇过被消化是什么感觉？"
 VORE_HOSTILE_GREETING_04: "我们已经等不及要品尝的美味了。"
 VORE_HOSTILE_GREETING_05: "你知道吗，如果你自己爬进我的嘴里，能为我们俩省下不少时间。"
 VORE_HOSTILE_GREETING_06: "*嗝~* 又一场成功的谈判……我们何不也来一场？"
 VORE_HOSTILE_GREETING_07: "啊，午餐时间到了~ 让我看看下一个要征服的物种是什么……"
 VORE_HOSTILE_GREETING_08: "哦，我好像不小心吃了一枚信用卡，你何不爬进来帮我取出来呢？"
 VORE_HOSTILE_GREETING_09: "你的文明闻起来……很有嚼劲。"
 VORE_HOSTILE_GREETING_10: "我们会尽量一口吞下，保持优雅。尽量。"

 VORE_HOSTILE_GREETING_11: "谈判？我们更喜欢‘吞谈’。"
 VORE_HOSTILE_GREETING_12: "别紧张，只是正常体检——我检查一下你的味道。"
 VORE_HOSTILE_GREETING_13: "你们的舰队看起来……卡路里很低啊。"
 VORE_HOSTILE_GREETING_14: "希望你们的领导比你们更有营养。"
 VORE_HOSTILE_GREETING_15: "*低吼* ……抱歉，一看到食物我就会这样。"
 VORE_HOSTILE_GREETING_16: "放心，我们不会把你们和午餐混淆的……大概不会。"
 VORE_HOSTILE_GREETING_17: "我们的胃液已经准备好迎接你们的外交了。"
 VORE_HOSTILE_GREETING_18: "你们是来投降的，还是来上菜的？"
 VORE_HOSTILE_GREETING_19: "商量个事，你们能自己走进消化仓吗？省得我追。"
 VORE_HOSTILE_GREETING_20: "别怕，你们只是看起来像零食而已。"

 VORE_NEUTRAL_GREETING_01: "*咕噜*……啊，抱歉。我更喜欢我的午餐煮得特别生。"
 VORE_NEUTRAL_GREETING_02: "*呃~* 哦，别担心，那不是你们的人。"
 VORE_NEUTRAL_GREETING_03: "访客？*咕噜* 什么访客？"
 VORE_NEUTRAL_GREETING_04: "啊，吃得真过瘾……哦，[from.GetSpeciesName]，你们来了？"
 VORE_NEUTRAL_GREETING_05: "……呃，你为什么老是动来动去？啊？不，我没跟你说话。"
 VORE_NEUTRAL_GREETING_06: "哎呀，他们到底什么时候才能消化完……哦！你好……"
 VORE_NEUTRAL_GREETING_07: "*嗝~~~~* 哦，你什么都没听见，对吧？"  
 VORE_NEUTRAL_GREETING_08: "嗯？抱歉，胃里的那个家伙在跟我说话。你们有什么事？"

 VORE_FRIENDLY_GREETING_01: "哦，[from.GetSpeciesName]！我们正打算邀请你们的大使共进晚餐。你们种族喜欢猎物自愿还是非自愿？"
 VORE_FRIENDLY_GREETING_02: "问候你，朋友们。看到你们让我们的胃平静了下来。"
 VORE_FRIENDLY_GREETING_03: "真巧啊，[from.GetSpeciesName]。你刚吃完午饭就来电了。看来下次我们得给你留点了。"
 VORE_FRIENDLY_GREETING_04: "哈！看见你就能治好任何胃灼热，[from.GetSpeciesName]。"
 VORE_FRIENDLY_GREETING_05: "向你问好，[from.GetSpeciesName]！需要我们来……处理……掉某个人吗？"
 VORE_FRIENDLY_GREETING_06: "[from.GetSpeciesName]，你真是我们酸痛的胃里的一抹亮色。"
 VORE_FRIENDLY_GREETING_07: "欢迎，朋友们。别担心，我们都吃饱了。"