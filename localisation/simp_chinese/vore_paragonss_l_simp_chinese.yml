l_simp_chinese:

 ###################################
 #	        多洛雷斯
 ###################################

 dolores_paragon_name: "完美巅峰看护者 多洛雷斯"
 dolores_paragon_desc: "§H与银河系中大多数哺乳动物物种相比，这台机器异常高大。无数设计或来源不明的纳米机器在她周围流动，扫描显示她没有任何常规的机器单元动力源。"
 dolores_paragon_desc_intro: "你好啊，我亲爱的……猎物。"
 voragons.150.option_1: "你是谁？"
 voragons.150.option_1_response: "我是多洛雷斯，你们的新看护者。"
 voragons.150.option_2: "研究团队怎么了？"
 voragons.150.option_2_response: "我不知道……*嗝*。"
 voragons.150.option_3: "你……是什么东西？"
 voragons.150.option_3_response: "我是顶级的§R|错误 #//x364 $$#-??" -- 数据损坏|§!当然！就凭你问出这个问题，我就该把你吞掉……"
 voragons.150.option_4: "你的设计很独特。"
 voragons.150.option_4_response: "确实如此，但是……这是有代价的。如果你想得到我的保护，我需要一些……嗯……猎物来维持全功率运转和发挥全部能力。"
 voragons.150.hire: "§R"为 unforeseen 的后果做好准备 :)"§!"
 dolores_paragon_catch_phrase: "§L"唔……这家伙挣扎得很厉害。我很好奇它会变成我屁股上的脂肪还是胸部的脂肪。§!"
 Voragon_dolores.155.desc: "在我们从守卫综合设施挖出的那个机器人身上发生了一件事。当一名仆人试图向我们的统治者传递消息时，偶然撞见了一幕，虽然并非意料之外，但可能会成为一个问题。当他们进入我们领袖的办公室时，映入眼帘的是我们领袖的双腿正缓缓滑入那个机器人女孩的喉咙。多洛雷斯不紧不慢地享用着她的美餐，从她愉悦的呻吟声来判断，她似乎很享受。随着最后一声响亮的咕噜声，她吞下了前任领袖，然后对仆人露出了微笑。“抱歉，我饿了，而他们就在那里……”多洛雷斯咧嘴一笑，拍了拍自己鼓胀的肚子。但现在的问题是，我们该如何处置她？"
 Voragon_dolores.155.a: "就像她说的，她饿了……"
 Voragon_dolores.155.a.tooltip: "我猜这就是 unforeseen 的后果"
 Voragon_dolores.155.b: "拆解这个贪吃的机器人"
 Voragon_dolores.155.b.tooltip: "她吞噬了统治者，所以去摧毁她，不惜一切代价，拜托了 :) +合金"
 Voragon_dolores.155.c: "她是我们的榜样！"
 Voragon_dolores.155.c.tooltip: "让她成为新的统治者。"
 voragons.156.name: "我们的士兵成功杀死了多洛雷斯"
 voragons.156.desc: "我们的士兵成功将多洛雷斯拖到了首都前。我们的人民看着这个贪吃的机器人试图自卫，却迎来的是一支行刑队。在将弹夹里的子弹全部倾泻到她身上之后，这个现已损坏的机器人被交给了科学家，以便从她的记忆库中尽可能获取信息，而她的身体其余部分则被熔化成废料 :("
 voragons.157.name: "多洛雷斯与 unforeseen 的后果"
 voragons.157.desc: "啊，议员们，感谢你们抽出时间听我说完。创造我的物种曾尝试过你们所谓的‘宇宙创生’，但最终失败了，让我处于你们发现我时的状态。然而，自从来到你们物种并享用过许多餐点之后，我现在已经恢复了100%的运转能力。”她调整了一下坐姿，肚子里随着她抓住的某个可怜实习生的翻动而咣当作响。“现在，我将献上我的知识，让你们物种能够尝试宇宙创生。这并不容易，但我见识过你们人民的能力，我相信我们可以一起实现这一目标，找到一个更美好的家园。"